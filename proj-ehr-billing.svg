<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE7D2"/>
      <stop offset="100%" stop-color="#FFE0E6"/>
    </linearGradient>
    <linearGradient id="eb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF5D5D"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#eb-bg)"/>
  <circle cx="440" cy="270" r="110" fill="#FF5D5D" opacity="0.08"/>
  <circle cx="30" cy="30" r="80" fill="#FF9F1C" opacity="0.08"/>

  <!-- shield (HIPAA) -->
  <g transform="translate(60,70)">
    <path d="M60 0 L118 22 V80 C118 128 90 158 60 172 C30 158 2 128 2 80 V22 Z" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <path d="M60 14 L104 30 V80 C104 118 82 142 60 154 C38 142 16 118 16 80 V30 Z" fill="url(#eb-grad)" opacity="0.14"/>
    <path d="M38 82 L54 98 L86 58" fill="none" stroke="url(#eb-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- claim / invoice document -->
  <g transform="translate(210,46)">
    <rect width="190" height="230" rx="14" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <rect x="20" y="24" width="120" height="14" rx="4" fill="url(#eb-grad)"/>
    <rect x="20" y="48" width="80" height="8" rx="4" fill="#1E1B2E" opacity="0.14"/>

    <g fill="#1E1B2E" opacity="0.1">
      <rect x="20" y="76" width="150" height="1.6"/>
      <rect x="20" y="98" width="150" height="1.6"/>
      <rect x="20" y="120" width="150" height="1.6"/>
      <rect x="20" y="142" width="150" height="1.6"/>
    </g>
    <rect x="20" y="82" width="90" height="8" rx="4" fill="#1E1B2E" opacity="0.16"/>
    <rect x="140" y="82" width="30" height="8" rx="4" fill="url(#eb-grad)" opacity="0.7"/>
    <rect x="20" y="104" width="70" height="8" rx="4" fill="#1E1B2E" opacity="0.16"/>
    <rect x="140" y="104" width="30" height="8" rx="4" fill="url(#eb-grad)" opacity="0.7"/>
    <rect x="20" y="126" width="100" height="8" rx="4" fill="#1E1B2E" opacity="0.16"/>
    <rect x="140" y="126" width="30" height="8" rx="4" fill="url(#eb-grad)" opacity="0.7"/>

    <rect x="20" y="164" width="150" height="46" rx="8" fill="url(#eb-grad)" opacity="0.12"/>
    <rect x="32" y="176" width="70" height="8" rx="4" fill="url(#eb-grad)"/>
    <rect x="32" y="192" width="50" height="7" rx="3.5" fill="#1E1B2E" opacity="0.16"/>
    <circle cx="152" cy="187" r="14" fill="url(#eb-grad)"/>
    <path d="M146 187 l4 4 l8 -9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- EDI flow dots/lines -->
  <g stroke="url(#eb-grad)" stroke-width="2" opacity="0.55" fill="none">
    <path d="M126 130 C 160 130 170 150 205 150" stroke-dasharray="4 6"/>
  </g>
  <circle cx="126" cy="130" r="5" fill="url(#eb-grad)"/>

  <!-- bar chart card -->
  <g transform="translate(40,210)">
    <rect width="140" height="86" rx="12" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <rect x="16" y="50" width="14" height="20" rx="3" fill="url(#eb-grad)" opacity="0.5"/>
    <rect x="38" y="34" width="14" height="36" rx="3" fill="url(#eb-grad)" opacity="0.75"/>
    <rect x="60" y="42" width="14" height="28" rx="3" fill="url(#eb-grad)" opacity="0.6"/>
    <rect x="82" y="20" width="14" height="50" rx="3" fill="url(#eb-grad)"/>
    <rect x="104" y="30" width="14" height="40" rx="3" fill="url(#eb-grad)" opacity="0.85"/>
    <rect x="16" y="14" width="80" height="7" rx="3.5" fill="#1E1B2E" opacity="0.14"/>
