<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="th-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE1E1"/>
      <stop offset="100%" stop-color="#FFEFD9"/>
    </linearGradient>
    <linearGradient id="th-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF5D5D"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#th-bg)"/>
  <circle cx="50" cy="270" r="100" fill="#FF9F1C" opacity="0.08"/>
  <circle cx="440" cy="30" r="90" fill="#FF5D5D" opacity="0.08"/>

  <!-- main video call window (doctor) -->
  <g transform="translate(70,50)">
    <rect width="230" height="180" rx="16" fill="#1E1B2E"/>
    <rect x="0" y="0" width="230" height="180" rx="16" fill="url(#th-grad)" opacity="0.16"/>
    <circle cx="115" cy="78" r="38" fill="url(#th-grad)" opacity="0.9"/>
    <circle cx="115" cy="66" r="15" fill="#FFF3E0"/>
    <path d="M78 128c6-20 21-28 37-28s31 8 37 28" fill="#FFF3E0"/>
    <rect x="14" y="14" width="52" height="16" rx="8" fill="#FF5D5D"/>
    <circle cx="24" cy="22" r="3.4" fill="#fff"/>
    <rect x="34" y="18.5" width="26" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="14" y="146" width="80" height="10" rx="5" fill="#fff" opacity="0.85"/>
    <rect x="14" y="160" width="56" height="8" rx="4" fill="#fff" opacity="0.5"/>
  </g>

  <!-- self / patient thumbnail -->
  <g transform="translate(255,170)">
    <rect width="96" height="72" rx="12" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <circle cx="48" cy="30" r="16" fill="url(#th-grad)" opacity="0.85"/>
    <circle cx="48" cy="25" r="6.4" fill="#fff"/>
    <path d="M34 42c3-8 9-11 14-11s11 3 14 11" fill="#fff"/>
    <rect x="18" y="56" width="60" height="6" rx="3" fill="#1E1B2E" opacity="0.12"/>
  </g>

  <!-- call controls bar -->
  <g transform="translate(140,238)">
    <rect width="140" height="40" rx="20" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <circle cx="30" cy="20" r="12" fill="#1E1B2E" opacity="0.08"/>
    <circle cx="70" cy="20" r="12" fill="#1E1B2E" opacity="0.08"/>
    <circle cx="110" cy="20" r="12" fill="url(#th-grad)"/>
    <path d="M20 20a10 10 0 1120 0 10 10 0 01-20 0z" fill="none"/>
    <path d="M26 15v10a4 4 0 008 0v-10a4 4 0 00-8 0z" fill="#1E1B2E" opacity="0.55"/>
    <rect x="63" y="14" width="14" height="10" rx="2" fill="#1E1B2E" opacity="0.5"/>
    <path d="M103 12l14 8-14 8z" fill="#fff"/>
  </g>

  <!-- signal / heartbeat waveform ribbon -->
  <g transform="translate(20,20)">
    <path d="M0 26 H30 L38 6 L48 46 L58 26 H90" fill="none" stroke="url(#th-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <g transform="translate(360,235)">
    <path d="M0 20 H20 L26 4 L34 36 L42 20 H70" fill="none" stroke="url(#th-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- connection dots -->
  <circle cx="330" cy="70" r="4" fill="url(#th-grad)" opacity="0.8"/>
  <circle cx="350" cy="90" r="3" fill="url(#th-grad)" opacity="0.5"/>
  <circle cx="316" cy="94" r="2.4" fill="url(#th-grad)" opacity="0.4"/>
</svg>
