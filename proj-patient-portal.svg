<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEFD9"/>
      <stop offset="100%" stop-color="#FFE1E1"/>
    </linearGradient>
    <linearGradient id="pp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF5D5D"/>
    </linearGradient>
    <linearGradient id="pp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8EF"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#pp-bg)"/>
  <circle cx="60" cy="260" r="120" fill="#FF9F1C" opacity="0.08"/>
  <circle cx="430" cy="40" r="90" fill="#FF5D5D" opacity="0.08"/>

  <!-- laptop base -->
  <g transform="translate(90,60)">
    <rect x="0" y="0" width="300" height="190" rx="14" fill="url(#pp-card)" stroke="#1E1B2E" stroke-opacity="0.06"/>
    <rect x="0" y="0" width="300" height="34" rx="14" fill="#1E1B2E" opacity="0.04"/>
    <circle cx="18" cy="17" r="4" fill="#FF5D5D"/>
    <circle cx="32" cy="17" r="4" fill="#FF9F1C"/>
    <circle cx="46" cy="17" r="4" fill="#FFD166"/>

    <!-- calendar / appointment card -->
    <g transform="translate(20,52)">
      <rect width="122" height="118" rx="10" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
      <rect x="12" y="14" width="98" height="14" rx="4" fill="url(#pp-grad)" opacity="0.85"/>
      <g fill="#1E1B2E" opacity="0.12">
        <rect x="12" y="40" width="20" height="18" rx="3"/>
        <rect x="38" y="40" width="20" height="18" rx="3"/>
        <rect x="64" y="40" width="20" height="18" rx="3"/>
        <rect x="90" y="40" width="20" height="18" rx="3"/>
        <rect x="12" y="64" width="20" height="18" rx="3"/>
        <rect x="64" y="64" width="20" height="18" rx="3"/>
        <rect x="90" y="64" width="20" height="18" rx="3"/>
      </g>
      <rect x="38" y="64" width="20" height="18" rx="3" fill="url(#pp-grad)"/>
      <rect x="12" y="94" width="98" height="10" rx="4" fill="#1E1B2E" opacity="0.1"/>
    </g>

    <!-- provider search + chat -->
    <g transform="translate(156,52)">
      <rect width="124" height="54" rx="10" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
      <circle cx="26" cy="27" r="14" fill="url(#pp-grad)"/>
      <path d="M20 27a6 6 0 1112 0 6 6 0 01-12 0z" fill="none"/>
      <circle cx="26" cy="22" r="4.2" fill="#FFFFFF"/>
      <path d="M18 32c1.5-3.5 5-4.5 8-4.5s6.5 1 8 4.5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="50" y="16" width="62" height="8" rx="4" fill="#1E1B2E" opacity="0.14"/>
      <rect x="50" y="30" width="46" height="7" rx="3.5" fill="#1E1B2E" opacity="0.08"/>

      <rect y="66" width="124" height="52" rx="10" fill="url(#pp-grad)" opacity="0.92"/>
      <circle cx="16" cy="82" r="3" fill="#fff"/>
      <rect x="26" y="78" width="80" height="8" rx="4" fill="#fff" opacity="0.85"/>
      <rect x="16" y="96" width="70" height="7" rx="3.5" fill="#fff" opacity="0.6"/>
    </g>
  </g>

  <!-- floating pin (provider search) -->
  <g transform="translate(365,150)">
    <circle r="26" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <path d="M0,-11 C6,-11 10,-7 10,-1 C10,6 0,15 0,15 C0,15 -10,6 -10,-1 C-10,-7 -6,-11 0,-11z" fill="url(#pp-grad)"/>
    <circle r="3.4" fill="#fff"/>
  </g>

  <!-- payment / billing chip -->
  <g transform="translate(72,225)">
    <rect width="86" height="54" rx="10" fill="#FFFFFF" stroke="#1E1B2E" stroke-opacity="0.08"/>
    <rect x="10" y="12" width="24" height="16" rx="3" fill="url(#pp-grad)"/>
    <rect x="10" y="36" width="66" height="6" rx="3" fill="#1E1B2E" opacity="0.12"/>
    <rect x="10" y="46" width="40" height="6" rx="3" fill="#1E1B2E" opacity="0.08"/>
  </g>
</svg>
